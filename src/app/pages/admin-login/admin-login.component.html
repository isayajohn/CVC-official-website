<section class="auth-shell">
  <div class="auth-panel auth-panel-brand">
    <img src="/logo-cvc.svg" alt="CVC logo" class="auth-logo" />
    <p class="eyebrow">Admin</p>
    <h1>{{ siteName }}</h1>
    <p>{{ t("admin.loginSubtitle") }}</p>
  </div>

  <div class="auth-panel">
    <p class="eyebrow">Secure Access</p>
    <h2>{{ t("admin.loginTitle") }}</h2>

    @if (errorMessage) {
      <div class="status-banner error-banner">{{ errorMessage }}</div>
    }

    <form class="form-stack" (ngSubmit)="submit()">
      <label class="field">
        <span>{{ t("admin.username") }}</span>
        <input class="input" name="username" [(ngModel)]="username" />
      </label>

      <label class="field">
        <span>{{ t("admin.password") }}</span>
        <input
          class="input"
          type="password"
          name="password"
          [(ngModel)]="password"
        />
      </label>

      <button type="submit" class="btn btn-primary" [disabled]="isLoading">
        {{ isLoading ? t("admin.signingIn") : t("admin.signIn") }}
      </button>
    </form>

    <p class="helper-copy">{{ t("admin.demoHint") }}</p>
    <a class="text-link" [routerLink]="link()">{{ t("common.backToSite") }}</a>
  </div>
</section>
