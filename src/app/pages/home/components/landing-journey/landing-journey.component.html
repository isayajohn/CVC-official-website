<section class="section landing-journey">
  <div class="container">
    <div class="section-heading inline-heading landing-journey__heading">
      <div>
        <p class="eyebrow">Journey</p>
        <h2>{{ t("home.historyTitle") }}</h2>
      </div>
      <a
        class="text-link"
        [href]="instagramUrl"
        target="_blank"
        rel="noreferrer"
      >
        {{ t("home.followJourney") }}
      </a>
    </div>

    <div class="card-grid landing-journey__grid">
      @for (item of milestones; track item.year) {
        <article class="card media-card landing-journey__card">
          <img [src]="item.image" [alt]="item.headline" class="card-cover" />
          <div class="card-body">
            <p class="eyebrow">{{ item.year }}</p>
            <h3>{{ item.headline }}</h3>
            <p>{{ item.intro }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
