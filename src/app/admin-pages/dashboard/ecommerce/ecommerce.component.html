<app-page-breadcrumb
  pageTitle="Dashboard"
  description="Overview of choir operations, sales and recent activity."
>
  <a [routerLink]="newInvoiceLink">
    <app-button variant="primary">New invoice</app-button>
  </a>
</app-page-breadcrumb>

<div class="grid grid-cols-12 gap-4 md:gap-6">
  <!-- Key metrics — full-width strip at the top -->
  <div class="col-span-12">
    <app-ecommerce-metrics />
  </div>

  <!-- Large card: main performance chart -->
  <div class="col-span-12 lg:col-span-8">
    <app-monthly-sales-chart />
  </div>

  <!-- Medium card: monthly target -->
  <div class="col-span-12 lg:col-span-4">
    <app-monthly-target />
  </div>

  <!-- Wide card: full statistics chart -->
  <div class="col-span-12">
    <app-statics-chart />
  </div>

  <!-- Medium card: customer demographics -->
  <div class="col-span-12 lg:col-span-5">
    <app-demographic-card />
  </div>

  <!-- Tall/wide card: recent activity -->
  <div class="col-span-12 lg:col-span-7">
    <app-recent-orders />
  </div>
</div>
