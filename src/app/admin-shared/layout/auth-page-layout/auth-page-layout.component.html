<div class="relative p-6 bg-white z-1 dark:bg-gray-900 sm:p-0">
  <div
    class="relative flex flex-col justify-center w-full h-screen lg:flex-row dark:bg-gray-900 sm:p-0"
  >
    <ng-content></ng-content>
    <div
      class="items-center hidden w-full h-full lg:w-1/2 bg-gradient-to-br from-brand-950 to-brand-900 lg:grid relative overflow-hidden"
    >
      <div class="flex items-center justify-center z-1 px-8">
        <!-- ===== Common Grid Shape Start ===== -->
        <app-grid-shape />
        <!-- Subtle glass panel — explicitly allowed on auth pages -->
        <div
          class="flex flex-col items-center max-w-xs px-8 py-10 rounded-xl border border-white/15 bg-white/10 shadow-theme-lg backdrop-blur-md"
        >
          <a routerLink="/" class="block mb-5 rounded-lg bg-white p-3 shadow-theme-xs">
            <img width="64" height="64" src="/logo-cvc.svg" alt="CVC logo" />
          </a>
          <p class="text-center font-semibold text-white/90">
            {{ siteName }}
          </p>
          <p class="mt-1 text-center text-sm text-white/60">Admin Console</p>
        </div>
      </div>
    </div>
    <div class="fixed z-50 hidden bottom-6 right-6 sm:block">
      <app-theme-toggle-two />
    </div>
  </div>
</div>
