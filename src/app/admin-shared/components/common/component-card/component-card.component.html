<div
  class="rounded-xl border border-gray-200 bg-white transition-shadow dark:border-gray-800 dark:bg-white/[0.03] {{ className }}"
  [class.hover:shadow-theme-md]="interactive"
  [class.cursor-pointer]="interactive"
>
  <!-- Card Header -->
  <div class="flex items-start justify-between gap-3 px-6 py-5">
    <div>
      <h3 class="text-base font-semibold text-gray-800 dark:text-white/90">
        {{ title }}
      </h3>
      @if (desc) {
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
        {{ desc }}
      </p>
      }
    </div>
    <ng-content select="[card-actions]"></ng-content>
  </div>

  <!-- Card Body -->
  <div class="p-4 border-t border-gray-100 dark:border-gray-800 sm:p-6">
    <div class="space-y-6">
      <ng-content></ng-content>
    </div>
  </div>
</div>
