<div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
  <div>
    <nav aria-label="Breadcrumb">
      <ol class="flex items-center gap-1.5 text-theme-xs text-gray-500 dark:text-gray-400">
        <li>
          <a class="hover:text-gray-700 dark:hover:text-gray-300" [routerLink]="homeLink">Dashboard</a>
        </li>
        <li aria-hidden="true">/</li>
        <li class="text-gray-700 dark:text-gray-300">{{ pageTitle }}</li>
      </ol>
    </nav>
    <h1 class="mt-1 text-xl font-bold text-gray-800 dark:text-white/90 sm:text-2xl">
      {{ pageTitle }}
    </h1>
    @if (description) {
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ description }}</p>
    }
  </div>
  <div class="flex items-center gap-3">
    <ng-content></ng-content>
  </div>
</div>
